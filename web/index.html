<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Патчноуты THE FINALS на русском: баланс, оружие, специализации и карты.">
  <meta name="theme-color" content="#08080C">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Патчноуты">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>THE FINALS — патчноуты</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="splash/splash.css?v=2">

  <!-- Telegram Mini App SDK.
       Грузим асинхронно: у части провайдеров telegram.org недоступен, и
       синхронный тег держал бы пустой экран, пока не сработает таймаут.
       Без SDK приложение работает как обычный сайт, а если он всё же
       загрузится (пусть и позже), инициализация догонит его по первому кадру. -->
  <script>
    window.finalsTelegramInit = function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg || tg.__finalsReady) return;
      tg.__finalsReady = true;
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#08080C');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#08080C');
        // В полноэкранном режиме свайп вниз закрывает приложение - отключаем,
        // чтобы он не мешал листать длинные патчноуты.
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      } catch (e) {
        // Старый клиент Telegram: просто работаем как обычная веб-страница.
      }
    };
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js" async
          onload="window.finalsTelegramInit()"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #08080C;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <!-- Заставка: анимация лого DARKSIDE, пока грузится CanvasKit.
       Разметка и стили — web/splash/, логика — web/splash/splash.js.
       Единая canvas-сцена: планета, след и блик рисуются в одной
       системе координат, поэтому блик не может уехать с планеты. -->
  <div id="splash" aria-hidden="true">
    <div id="stage">
      <div id="logoGroup">
        <canvas id="scene" width="640" height="640"></canvas>
      </div>
      <div id="title">DARKSIDE</div>
      <div id="subtitle">by Anarchist</div>
    </div>
  </div>

  <script src="splash/splash.js?v=2"></script>

  <script>
    // Если SDK успел загрузиться из кеша до этого места - инициализируемся.
    if (window.Telegram && window.Telegram.WebApp) window.finalsTelegramInit();

    window.addEventListener('flutter-first-frame', function () {
      // SDK мог догрузиться уже после старта приложения.
      window.finalsTelegramInit();

      // Анимация проигрывается целиком; заставка уйдёт, когда отыграет
      // финал и приложение уже будет отрисовано.
      if (window.finalsSplash) {
        window.finalsSplash.finish();
        return;
      }
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 240);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
