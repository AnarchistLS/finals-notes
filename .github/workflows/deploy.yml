name: Деплой Mini App

# Собираем Flutter Web и выкладываем на Cloudflare Pages.
# Запускается на каждый пуш в main (в том числе на коммит с новыми данными)
# и вручную из вкладки Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-miniapp
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Сборка web
        run: flutter build web --release --base-href /

      # Проект создаётся один раз; если он уже есть - шаг просто падает
      # с ошибкой "already exists", и это нормально.
      - name: Создать проект Pages (если его нет)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create finals-notes --production-branch=main

      - name: Выложить
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=finals-notes --branch=main
