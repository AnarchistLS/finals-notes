name: Деплой Mini App

# Собираем Flutter Web и выкладываем на GitHub Pages.
# Запускается на каждый пуш в main (в том числе на коммит с новыми данными)
# и вручную из вкладки Actions.
#
# Почему GitHub Pages, а не Cloudflare: провайдеры в России блокируют
# *.pages.dev (домен подменяется заглушкой), а github.io открывается.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Вызов из «Обновление патчей»: коммит, сделанный ботом через GITHUB_TOKEN,
  # не запускает другие workflow, поэтому деплой зовём напрямую.
  workflow_call:

concurrency:
  group: deploy-miniapp
  # Не отменяем предыдущий деплой: он мог быть вызван из задачи обновления
  # и нести свежие данные. Деплои просто идут друг за другом.
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      # base-href = путь проекта на GitHub Pages: /<репозиторий>/
      - name: Сборка web
        run: flutter build web --release --base-href /finals-notes/

      # enablement включает Pages, если он ещё не включён в настройках.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Выложить
        id: deployment
        uses: actions/deploy-pages@v4
