name: Обновление патчей

# Раз в 15 минут проверяем сайт: если вышел новый патч - переводим, постим в
# канал и обновляем данные для Mini App. Ничего не требует включённого ПК.
# 15 минут, а не час: у публичного репозитория минуты Actions бесплатны и
# безлимитны. Если репозиторий снова станет приватным - верните раз в 2 часа,
# иначе не хватит лимита 2000 минут в месяц.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      init:
        description: 'Запомнить текущий патч и ничего не публиковать'
        type: boolean
        default: false
      force:
        description: 'Опубликовать патч заново, даже если он уже был'
        type: boolean
        default: false

# Один запуск за раз: два обновления одновременно писали бы в одни файлы.
concurrency:
  group: update-patches
  cancel-in-progress: false

permissions:
  contents: write
  # Нужны задаче деплоя, которую этот workflow вызывает: без них
  # deploy-pages не может запросить OIDC-токен и падает.
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: если кто-то закоммитил в main, пока шёл запуск,
          # rebase перед push должен найти общий предок.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Пост в канал
        if: ${{ !inputs.init }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TRANSLATE_BACKEND: deepl
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          # Ссылка на Mini App. По умолчанию - короткий адрес нашего бота,
          # чтобы кнопка работала и без настройки variable.
          MINIAPP_URL: ${{ vars.MINIAPP_URL || 'https://t.me/finals_notes_bot/app' }}
        run: dart run tool/bot.dart --once ${{ inputs.force && '--force' || '' }}

      - name: Запомнить текущий патч
        if: ${{ inputs.init }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: dart run tool/bot.dart --once --init

      - name: Данные для Mini App
        env:
          TRANSLATE_BACKEND: deepl
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: dart run tool/publish.dart

      - name: Коммит данных
        # Даже если пост упал, состояние и кеш стоит сохранить: иначе
        # следующий запуск попробует опубликовать тот же патч ещё раз.
        if: always()
        run: |
          git config user.name "finals-notes bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A web/data tool
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "data: патчи на $(date -u +%Y-%m-%dT%H:%MZ)"
          # Пока шёл запуск, в main мог прилететь чужой коммит (например,
          # правка кода). Тогда push отклоняется - подтягиваем и пробуем снова.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push не прошёл, подтягиваю изменения (попытка $attempt)"
            git pull --rebase --autostash || true
          done
          echo "не удалось запушить данные" >&2
          exit 1

      - name: Отметка активности
        # GitHub отключает расписание в публичном репозитории после 60 дней
        # без коммитов. Раз в месяц трогаем маленький файл, чтобы не отключил.
        if: always()
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "не первое число — пропускаю"
            exit 0
          fi
          echo "$(date -u +%Y-%m-%dT%H:%MZ)" > tool/.last-run
          git add tool/.last-run
          if git diff --cached --quiet; then
            echo "Отметка уже стоит"
            exit 0
          fi
          git commit -m "chore: отметка активности"
          git push

  # Деплой вызывается из этого же запуска: коммит данных сделан через
  # GITHUB_TOKEN и сам по себе другие workflow не запускает.
  deploy:
    needs: update
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
