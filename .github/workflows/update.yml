name: Обновление патчей

# Раз в два часа проверяем сайт: если вышел новый патч - переводим, постим в
# канал и обновляем данные для Mini App. Ничего не требует включённого ПК.
# Два часа, а не час: каждый запуск ест ~2 минуты бесплатного лимита Actions
# (2000 мин/мес у приватного репозитория). Нужен час - поменяйте cron.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      init:
        description: 'Запомнить текущий патч и ничего не публиковать'
        type: boolean
        default: false

# Коммит данных запускает деплой, но не этот workflow: здесь нет push-триггера.
concurrency:
  group: update-patches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Пост в канал
        if: ${{ !inputs.init }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TRANSLATE_BACKEND: deepl
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          MINIAPP_URL: ${{ vars.MINIAPP_URL }}
        run: dart run tool/bot.dart --once

      - name: Запомнить текущий патч
        if: ${{ inputs.init }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: dart run tool/bot.dart --once --init

      - name: Данные для Mini App
        env:
          TRANSLATE_BACKEND: deepl
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: dart run tool/publish.dart

      - name: Коммит данных
        # Даже если пост упал, состояние и кеш стоит сохранить: иначе
        # следующий запуск попробует опубликовать тот же патч ещё раз.
        if: always()
        run: |
          git config user.name "finals-notes bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A web/data tool
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "data: патчи на $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
