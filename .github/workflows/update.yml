name: Обновление патчей

# Частые проверки делает внешний cron (cron-job.org): он раз в 15 минут
# вызывает этот workflow через API. Расписание ниже - страховка на случай,
# если внешний cron отвалится: GitHub всё равно выполняет его не чаще
# примерно раза в 40 минут.
# Если репозиторий снова станет приватным - уберите schedule совсем или
# оставьте раз в 6 часов: 2000 минут в месяц на частые запуски не хватит.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      init:
        description: 'Запомнить текущий патч и ничего не публиковать'
        type: boolean
        default: false
      force:
        description: 'Опубликовать патч заново, даже если он уже был'
        type: boolean
        default: false
      patch:
        description: 'Опубликовать конкретный патч (id из --list, напр. 11-110)'
        type: string
        default: ''

# Один запуск за раз: два обновления одновременно писали бы в одни файлы.
concurrency:
  group: update-patches
  cancel-in-progress: false

permissions:
  contents: write
  # Нужны задаче деплоя, которую этот workflow вызывает: без них
  # deploy-pages не может запросить OIDC-токен и падает.
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      # SHA коммита с данными: деплой должен собирать именно его, а не
      # состояние main на момент старта задачи (иначе на сайт уезжают
      # данные прошлого запуска, и новый патч не появляется в приложении).
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: если кто-то закоммитил в main, пока шёл запуск,
          # rebase перед push должен найти общий предок.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      # ffmpeg нужен боту: из зацикленного видео патча он собирает «гифку»
      # для канала. В свежих образах ubuntu-раннеров пакета нет.
      - name: ffmpeg
        run: sudo apt-get install -y -qq ffmpeg

      - name: Пост в канал
        if: ${{ !inputs.init }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TRANSLATE_BACKEND: deepl
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          # Ссылка на Mini App. По умолчанию - короткий адрес нашего бота,
          # чтобы кнопка работала и без настройки variable.
          MINIAPP_URL: ${{ vars.MINIAPP_URL || 'https://t.me/finals_notes_bot/app' }}
        run: dart run tool/bot.dart --once ${{ inputs.force && '--force' || '' }} ${{ inputs.patch && format('--patch={0}', inputs.patch) || '' }}

      - name: Запомнить текущий патч
        if: ${{ inputs.init }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: dart run tool/bot.dart --once --init

      - name: Данные для Mini App
        # Даже если пост в канал не ушёл, приложение должно получить свежие
        # данные: бот повторит публикацию на следующем запуске.
        if: always()
        env:
          TRANSLATE_BACKEND: deepl
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: dart run tool/publish.dart

      - name: Коммит данных
        id: commit
        # Даже если пост упал, состояние и кеш стоит сохранить: иначе
        # следующий запуск попробует опубликовать тот же патч ещё раз.
        if: always()
        run: |
          git config user.name "finals-notes bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A web/data tool
          if git diff --cached --quiet; then
            echo "Изменений нет"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: патчи на $(date -u +%Y-%m-%dT%H:%MZ)"
          # Пока шёл запуск, в main мог прилететь чужой коммит (например,
          # правка кода). Тогда push отклоняется - подтягиваем и пробуем снова.
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push не прошёл, подтягиваю изменения (попытка $attempt)"
            git pull --rebase --autostash || true
          done
          echo "не удалось запушить данные" >&2
          exit 1

      - name: Отметка активности
        # GitHub отключает расписание в публичном репозитории после 60 дней
        # без коммитов. Раз в месяц трогаем маленький файл, чтобы не отключил.
        if: always()
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "не первое число — пропускаю"
            exit 0
          fi
          echo "$(date -u +%Y-%m-%dT%H:%MZ)" > tool/.last-run
          git add tool/.last-run
          if git diff --cached --quiet; then
            echo "Отметка уже стоит"
            exit 0
          fi
          git commit -m "chore: отметка активности"
          git push

  # Деплой вызывается из этого же запуска: коммит данных сделан через
  # GITHUB_TOKEN и сам по себе другие workflow не запускает.
  deploy:
    needs: update
    # Сборка Flutter занимает пару минут, поэтому запускаем её только когда
    # данные реально изменились (или при первом наполнении).
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    # Передаём SHA коммита с данными: по умолчанию вызываемый workflow
    # собирает состояние main на момент старта задачи, то есть БЕЗ свежих
    # данных. Из-за этого Mini App показывал предыдущий патч.
    with:
      sha: ${{ needs.update.outputs.sha }}
